name: Daily Freshness Build

on:
  schedule:
    # 10:00 UTC = 07:00 ARG every day during tournament
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mundialenvivo-live --branch=main

      - name: Push today's URLs to IndexNow
        run: node scripts/push-today.js
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
